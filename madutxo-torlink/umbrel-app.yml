manifestVersion: 1
id: madutxo-torlink
storage:
  dataRoot: data
category: networking
name: torlink
version: "1.10.4"
tagline: Search and download movies, TV, and anime from your browser
description: >-
  torlink is a terminal-native torrent finder and downloader, packaged for
  Umbrel as a browser terminal. Search curated public indexes for movies, TV,
  and anime, pick a result, and save it straight to your Umbrel Downloads
  folder — ready for Jellyfin.


    Downloads keep running when you close the tab; reopen the app to reattach to
    the same session. The interface is a terminal, so a desktop browser is
    recommended.


    WARNING: torlink searches public torrent indexes over the clearnet. It does
    not route searches or peer traffic through Tor. Downloads and the content
    you choose are your responsibility; only download from sources you trust.


    Notes:

    - Files are saved to your Umbrel Downloads folder.

    - Close the browser tab to detach. Pressing Ctrl-C inside torlink quits it and
    stops downloads.

    - WebRTC and uTP are disabled. No peer port is published, so inbound
    seeding is not guaranteed; downloads do not require it.

    - The Games category (FitGirl game repacks) is disabled in this port:
      Jellyfin-friendly media only. Movies, TV, and Anime remain available.

    - Settings and queue state persist across restarts.

    - Concurrent downloads are capped at 3. In-app update checks are disabled;
    updates arrive through the app store.
releaseNotes: >-
  1.10.4:
  - Browser tab now shows "TorLink" instead of the raw node command line.
    The tmux window title is set via `set-titles-string` so it survives
    detach/reattach across tab closes.

  1.10.3:
  - Image rebuilt with the detached-tmux attach flow and opt-in seeding
    from 1.10.2, re-published under a new tag.

  1.10.2:
  - Downloads now keep running when you close the browser tab: the TUI runs in
    a detached tmux session, so closing the tab only detaches and reopening
    reattaches without pausing in-progress downloads.
  - Seeding is now opt-in: a finished download stays paused and does not peer
    or upload until you explicitly start seeding it.
  - A download that finds no peers for 3 hours auto-pauses; only a manual
    resume can restart it.
  - Memory fix (carried over from 1.10.1): bounds torlink memory use by
    disabling WebTorrent's 20-piece per-torrent cache. With 10 × 400 MB seeds
    this drops steady RSS from ~3.4 GB to ~100 MB.
  - Image rebuilt as 1.10.2 with a pinned digest.


  Port fix: bounds torlink memory use by disabling WebTorrent's 20-piece
  per-torrent cache (20 × piece length per seeded download, retained until
  restart). With 10 × 400 MB seeds this drops steady RSS from ~3.4 GB to
  ~100 MB. Active downloads still complete normally; seeding behavior is
  unchanged. Upstream torlink remains 1.10.0; this is a port-only patch.
  Image rebuilt as 1.10.1 with a pinned digest.


  Concurrent downloads are capped at 3, and in-app update checks are disabled
  so the running code stays pinned to the image digest.


  Searches and peer traffic use the clearnet, not Tor. No peer port is
  published, so inbound seeding is not guaranteed. Press Ctrl-C to quit
  and stop downloads; close the tab to detach.
