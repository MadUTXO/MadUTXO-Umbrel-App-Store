id: madutxo-torlink
storage:
  dataRoot: data
category: networking
name: TorLink
version: "1.11.8"
tagline: Search and download movies, TV, and anime from your browser
description: >-
  torlink is a terminal-native torrent finder and downloader, packaged for
  Umbrel as a browser terminal. Search curated public indexes for movies, TV,
  and anime, pick a result, and save it straight to your Umbrel Downloads
  folder — ready for Jellyfin.


    Downloads keep running when you close the tab; reopen the app to reattach to
    the same session. The interface is a terminal, so a desktop browser is
    recommended.


    WARNING: torlink searches public torrent indexes over the clearnet. Your
    search terms are visible to those index operators, and your home IP is
    visible to torrent trackers and peers. It does not route searches or peer
    traffic through Tor; use a VPN if that matters to you. Downloads and the
    content you choose are your responsibility; only download from sources you
    trust.


    Notes:

    - Files are saved to your Umbrel Downloads folder.

    - Close the browser tab to detach. Pressing Ctrl-C inside torlink quits it and
    stops downloads.

    - WebRTC and uTP are disabled. No peer port is published, so inbound
    seeding is not guaranteed; downloads do not require it.

    - Games are supported: the Games tab and `--category games` are available,
      with FitGirl as the game-repack source. Movies, TV, and Anime remain
      available too.

    - Settings and queue state persist across restarts.

    - Concurrent downloads are capped at 3. In-app update checks are disabled;
    updates arrive through the app store.
releaseNotes: >-
  1.11.8:
  - Security: the writable terminal is now isolated from co-resident apps.
    ttyd binds only to 127.0.0.1:7682; the app port (7681) is served by a new
    nginx reverse proxy that allows the Umbrel app proxy (10.21.0.1) and
    denies the app subnet (10.21.0.0/16). Normal browser use is unchanged.
  - Rebuilt image (build target 1.11.8), pinned by digest.

  1.11.7:
  - Display name is now "TorLink" in the dashboard and app list (the app id,
    data directory and downloads are unchanged, so nothing is migrated).

  1.11.6:
  - Fix a resource leak: a finished download is now detached from the torrent
    engine instead of staying resident. Previously every completed torrent kept
    its peer connections, tracker announces and piece buffers in memory, so
    usage climbed as more torrents finished, even with seeding off (it is
    opt-in). Seeding still works: starting it re-adds the torrent.
  - Add container limits (2 GB memory, 512 processes) so a runaway swarm cannot
    take the whole host down. Raise them if large downloads are killed.

  1.11.5:
  - Security: the terminal now rejects WebSocket connections from a different
    origin (ttyd --check-origin). Previously any page you visited could open a
    cross-site WebSocket to the writable terminal, relying only on the app
    proxy. Normal use behind Umbrel is unaffected because the proxy preserves
    the Host header.
  - Reliability: a download that finishes now writes its seed record to disk
    immediately, so after an unclean restart it shows as paused instead of
    ready. No change to download or seeding behavior.

  1.11.4:
  - No user-facing change. Test-only fix: each parallel test worker now gets its
    own state directory, removing a flaky boot-marker test that failed
    intermittently in CI/local runs. The shipped runtime is byte-for-byte the
    same behavior as 1.11.3 (Games, no npm/curl).

  1.11.3:
  - Restore the Games category removed earlier in the 1.11 line. The Games
    tab, `--category games`, and FitGirl results are back. The 1.11.2 runtime
    hardening (no npm/npx/corepack or curl in the image) is retained.

  1.11.2:
  - Security: remove the unused npm/npx/corepack toolchain and curl from the
    runtime image. This clears fixable HIGH advisories in npm's bundled
    dependencies and in libcurl; downloads and search still use Node's fetch.
    The build still verifies the Games transform and fails loudly if an
    upstream change makes it a no-op.

  1.11.1:
  - Security: bump the transitive `ip-address` dependency from 10.2.0 to
    10.7.6, clearing GHSA-mwp4-54f8-5fhr and related SSRF / trust-boundary
    advisories (CWE-20, CWE-918). No functional change; verified by the full
    496-test suite and build.
  - The remaining `ip` advisory (GHSA-2p57-rm9w-gvfp) has no upstream fix;
    it is used only for tracker/peer IP handling, not as an SSRF guard, and
    is accepted for this client-only package.

  1.11.0:
  - Upstream torlink updated from 1.10.0 to 1.11.0 (commit 394b0b66):
    - WebTorrent 3 upgrade: fixes the UDP socket leak that left ~1 GB RSS and
      978 sockets idle with zero torrents; outgoing uTP peers now share one
      listening socket.
    - watch and files commands exit promptly on SIGTERM instead of hanging
      until kill -9.
    - New --interface / --peer-port / --dht-port options (TORLINK_INTERFACE,
      TORLINK_PEER_PORT, TORLINK_DHT_PORT env) bind all peer traffic to one
      network interface and fail closed when it drops (VPN-safe). Adds GET /
      POST /network API endpoints.
    - Dropped 1337x search source: every mirror is behind a Cloudflare
      browser challenge and cannot be scraped.
    - Plaintext peer pinning for webtorrent 3 compatibility; bound daemon
      refuses Origin headers on tokenless serve.
  - All port patches carried over: detached tmux session (tab-close survival),
    opt-in seeding, 3h no-peer auto-pause, memory cache disable
    (TORLINK_STORE_CACHE_SLOTS=0), Games category disabled, no host/peer
    ports published, WebRTC/uTP disabled, update checks disabled, max 3
    concurrent downloads, tab title shows "TorLink".

  1.10.7:
  - Browser tab now shows "TorLink" instead of the raw node command line.
    Uses ttyd's native `-t title=TorLink` option plus tmux window rename
    ("TorLink") and set-titles-string so the terminal title is set both in
    the HTML page and via tmux OSC sequences, surviving detach/reattach
    across tab closes.

  1.10.6:
  - Tab title fix attempted via tmux rename-window + set-titles-string only
    (not effective without ttyd title option, superseded by 1.10.7).

  1.10.5:
  - Tab title fix attempted via ttyd title option (not effective alone,
    superseded by 1.10.7 combined approach).

  1.10.4:
  - Image rebuilt with the detached-tmux attach flow and opt-in seeding
    from 1.10.2, re-published under a new tag.

  1.10.3:
  - Image rebuilt with the detached-tmux attach flow and opt-in seeding
    from 1.10.2, re-published under a new tag.

  1.10.2:
  - Downloads now keep running when you close the browser tab: the TUI runs in
    a detached tmux session, so closing the tab only detaches and reopening
    reattaches without pausing in-progress downloads.
  - Seeding is now opt-in: a finished download stays paused and does not peer
    or upload until you explicitly start seeding it.
  - A download that finds no peers for 3 hours auto-pauses; only a manual
    resume can restart it.
  - Memory fix (carried over from 1.10.1): bounds torlink memory use by
    disabling WebTorrent's 20-piece per-torrent cache. With 10 × 400 MB seeds
    this drops steady RSS from ~3.4 GB to ~100 MB.
  - Image rebuilt as 1.10.2 with a pinned digest.


  Port fix: bounds torlink memory use by disabling WebTorrent's 20-piece
  per-torrent cache (20 × piece length per seeded download, retained until
  restart). With 10 × 400 MB seeds this drops steady RSS from ~3.4 GB to
  ~100 MB. Active downloads still complete normally; seeding behavior is
  unchanged. Upstream torlink remains 1.10.0; this is a port-only patch.
  Image rebuilt as 1.10.1 with a pinned digest.


  Concurrent downloads are capped at 3, and in-app update checks are disabled
  so the running code stays pinned to the image digest.


  Searches and peer traffic use the clearnet, not Tor. No peer port is
  published, so inbound seeding is not guaranteed. Press Ctrl-C to quit
  and stop downloads; close the tab to detach.
