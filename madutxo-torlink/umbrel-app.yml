manifestVersion: 1
id: madutxo-torlink
storage:
  dataRoot: data
category: networking
name: TorLink
version: "1.11.14"
tagline: A sleek, zero-setup torrent finder and downloader in your browser terminal
description: >-
  TorLink is a sleek, zero-setup torrent finder and downloader that lives in
  your browser terminal. One search checks a short, curated list of trusted
  sources at once and whatever you pick downloads straight to your Umbrel 
  Downloads folder.
  Nothing routes through a central server and your files stay on your Umbrel.


    Downloads keep running when you close the tab; reopen the app to reattach to
    the same session. Seeding never starts automatically, you make the choice.
    The interface is a terminal, so a desktop browser is recommended.


    Notes:

    - Files are saved to your Umbrel Downloads folder.

    - Close the browser tab to detach. Pressing Ctrl-C inside torlink quits it and
    stops downloads.

    - WebRTC and uTP are disabled. No peer port is published, so inbound
    seeding is not guaranteed; downloads do not require it.

    - Settings and queue state persist across restarts. The app data folder
      also holds a small socket file (`handoff.sock`) that a launch uses to hand
      a magnet to the open window; it is recreated automatically.

    - Concurrent downloads are capped at 3. In-app update checks are disabled;
    updates arrive through the app store.

releaseNotes: >-
  1.11.14:
  - Image rebuilt from the same pinned upstream. No functional change.

