services:
  app_proxy:
    environment:
      APP_HOST: madutxo-torlink_torlink_1
      APP_PORT: 7681
      PROXY_AUTH_ADD: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run

  torlink:
    image: ghcr.io/madutxo/torlink:1.11.8@sha256:abfa6b19e1dc9016781776f9595d0c0633061451a4b900608226035ac3e6ffce
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    # Bound the daemon so a pathological swarm or a fork/socket burst cannot take
    # the whole host down. 3 concurrent downloads, client-global connection cap
    # (maxConns 55), and storeCacheSlots=0 keep steady-state usage well under
    # mem_limit; pids_limit covers node threads plus tmux/ttyd and peer workers.
    # These are a safety net, not a budget: tune up if downloads are OOM-killed.
    mem_limit: 2g
    pids_limit: 512
    expose:
      - "7681"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7681/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - TZ=${TZ:-UTC}
      - TORLINK_STATE_DIR=/state
      - TORLINK_NO_WEBRTC=1
      - TORLINK_NO_UTP=1
      - TORLINK_NO_UPDATE_CHECK=1
      - TORLINK_STORE_CACHE_SLOTS=0
      - TORLINK_MAX_DOWNLOADS=3
      - HOME=/state/home
      - TMUX_TMPDIR=/state/tmux
      - TERM=xterm-256color
      - LANG=C.UTF-8
    volumes:
      - ${APP_DATA_DIR}/data:/state
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
