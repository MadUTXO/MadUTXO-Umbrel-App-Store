worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Terminal traffic only: no access log (no IPs/URIs persisted) and no
    # version banner on error pages.
    access_log off;
    server_tokens off;

    # Read-only root filesystem: keep every temp path on the /tmp tmpfs.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7681;
        server_name _;

        # Only the Umbrel gateway (host-side, GATEWAY_IP 10.21.0.1) may reach the
        # writable terminal. Co-resident apps share umbrel_main_network and
        # arrive from 10.21.0.x; without this they could open ttyd directly and
        # get a shell as uid 1000 (ttyd -O cannot stop it: a container can forge
        # Host and Origin). Deny the range rather than "deny all" so a wrong
        # assumption cannot lock the operator out on a non-bridge ingress path.
        allow 10.21.0.1;
        deny 10.21.0.0/16;

        location / {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # ttyd -O compares Origin to Host:port; preserve both.
            proxy_set_header Host $http_host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
