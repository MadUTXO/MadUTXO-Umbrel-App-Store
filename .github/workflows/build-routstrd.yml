name: Build routstrd

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'madutxo-routstrd/Dockerfile'
      - 'madutxo-routstrd/entrypoint.sh'
      - 'madutxo-routstrd/terminal.sh'
      - 'madutxo-routstrd/tmux.conf'
      - 'madutxo-routstrd/supervisord.conf'
      - 'madutxo-routstrd/routstrd-wrapper.sh'
      - 'madutxo-routstrd/router/**'

concurrency:
  group: build-routstrd
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push 0.5.8
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./madutxo-routstrd
          file: ./madutxo-routstrd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/madutxo/routstrd:0.5.8
          labels: |
            org.opencontainers.image.title=Routstrd Remote
            org.opencontainers.image.source=https://github.com/MadUTXO/MadUTXO-Umbrel-App-Store
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.5.8
            com.madutxo.gatekeeper.revision=1e7bb3ab37f6e3e6f6298ac1c88d62b92b1c2bf8
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ghcr.io/madutxo/routstrd:0.5.8

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: routstrd-sbom
          path: sbom*

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ghcr.io/madutxo/routstrd:0.5.8'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: 'madutxo-routstrd/.trivyignore'
          exit-code: '1'

      - name: Upload Trivy results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: routstrd-trivy
          path: trivy-results.sarif

# Touched to force workflow re-registration after the repo recreate.
