name: Build routstrd

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'madutxo-routstrd/Dockerfile'
      - 'madutxo-routstrd/entrypoint.sh'
      - 'madutxo-routstrd/terminal.sh'
      - 'madutxo-routstrd/tmux.conf'
      - 'madutxo-routstrd/supervisord.conf'
      - 'madutxo-routstrd/router/**'
      - '.github/workflows/build-routstrd.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push 0.1.33
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./madutxo-routstrd
          file: ./madutxo-routstrd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/madutxo/routstrd:0.1.33
          labels: |
            org.opencontainers.image.title=routstrd
            org.opencontainers.image.source=https://github.com/Routstr/routstrd-remote
            org.opencontainers.image.revision=f5228ee3cc8ac7cdadb407a354bb7fc500bd4711
            org.opencontainers.image.version=0.1.33
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/madutxo/routstrd:0.1.33

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routstrd-sbom
          path: sbom*

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: 'ghcr.io/madutxo/routstrd:0.1.33'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routstrd-trivy
          path: trivy-results.sarif
