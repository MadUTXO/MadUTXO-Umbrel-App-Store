name: Build torlink

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'madutxo-torlink/Dockerfile'
      - 'madutxo-torlink/entrypoint.sh'
      - 'madutxo-torlink/torlink-memory.patch'
      - 'madutxo-torlink/hooks/**'
      - '.github/workflows/build-torlink.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push 1.10.1
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./madutxo-torlink
          file: ./madutxo-torlink/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/madutxo/torlink:1.10.1
          labels: |
            org.opencontainers.image.title=torlink
            org.opencontainers.image.source=https://github.com/MadUTXO/torlink
            org.opencontainers.image.revision=df059311d0898b7245dd842153c1ff7c892275ee
            org.opencontainers.image.version=1.10.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
