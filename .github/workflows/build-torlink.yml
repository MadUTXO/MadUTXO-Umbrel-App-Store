name: Build torlink

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'madutxo-torlink/Dockerfile'
      - 'madutxo-torlink/entrypoint.sh'
      - 'madutxo-torlink/torlink-memory.patch'
      - 'madutxo-torlink/torlink-bg-seed.patch'
      - 'madutxo-torlink/torlink-deps.patch'
      - 'madutxo-torlink/torlink-test-isolation.patch'
      # hooks/ ships through the app package and is not COPYed into the image,
      # so hook-only changes do not need a rebuild (same as electrs-liquid).
      - 'madutxo-torlink/router/**'

concurrency:
  group: build-torlink
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push 1.11.12
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./madutxo-torlink
          file: ./madutxo-torlink/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/madutxo/torlink:1.11.12
          labels: |
            org.opencontainers.image.title=torlink
            org.opencontainers.image.source=https://github.com/MadUTXO/MadUTXO-Umbrel-App-Store
            com.madutxo.upstream.source=https://github.com/baairon/torlink
            org.opencontainers.image.revision=5e89f6fd067c28f2c091c4beb9a82838e1b34cc5
            org.opencontainers.image.version=1.11.12
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        # Supplemental: its tool download from GitHub releases is occasionally
        # unavailable (HTTP 000/504). Must not fail an otherwise-good release.
        continue-on-error: true
        with:
          image: ghcr.io/madutxo/torlink:1.11.12

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: torlink-sbom
          path: sbom*
          if-no-files-found: ignore

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        # Supplemental: non-blocking, same rationale as the SBOM step.
        continue-on-error: true
        with:
          image-ref: 'ghcr.io/madutxo/torlink:1.11.12'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: torlink-trivy
          path: trivy-results.sarif
          if-no-files-found: ignore

# Touched to force workflow re-registration after the repo recreate.
