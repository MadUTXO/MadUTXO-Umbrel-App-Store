name: Retag libretranslate (one-off)

# Temporary: restore the 1.9.6 tag to the digest the package pins after a
# CI-only workflow edit re-ran the build. Verifies GHCR_PAT write access.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Point 1.9.6 back at the pinned digest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/madutxo/libretranslate:1.9.6 \
            ghcr.io/madutxo/libretranslate@sha256:c7bbef4d3f02740640bdaa2f246418f8e1eb99a1de953880c2be5f38dbde7590

      - name: Verify tag digest
        run: |
          docker buildx imagetools inspect ghcr.io/madutxo/libretranslate:1.9.6 | head -20
