name: Scan onionator (scheduled)

# Build-time Trivy is best-effort. This scheduled job is the strict complement:
# it re-scans the published, digest-pinned image and fails on any CRITICAL
# finding. The image is a scratch container holding one static Go binary, so
# the Go binary and its stdlib are the relevant surface.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: scan-onionator
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run govulncheck
        run: |
          docker run --rm \
            -e GOTOOLCHAIN=local \
            -v "$PWD/madutxo-onionator:/src:ro" \
            -w /src \
            golang:1.27.4-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280 \
            sh -eu -c 'go install golang.org/x/vuln/cmd/govulncheck@v1.10.0 && govulncheck ./...'

      - name: Verify scan target matches compose
        run: bash scripts/check-scan-target.sh .github/workflows/scan-onionator.yml madutxo-onionator/docker-compose.yml

      - name: Ensure package is public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          echo "ghcr token user: $(gh api /user --jq .login)"
          gh api --method PATCH /user/packages/container/onionator -f visibility=public \
            || GH_TOKEN="${{ github.token }}" gh api --method PATCH /user/packages/container/onionator -f visibility=public

      - name: Verify anonymous pull
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' 'https://ghcr.io/token?scope=repository:madutxo/onionator:pull&service=ghcr.io')"
          echo "anonymous token: $code"
          test "$code" = 200

      # GHCR_PAT so the strict scan can pull while the package is private.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'ghcr.io/madutxo/onionator:0.1.9@sha256:0a6cc16223bab0eee181a0cd040945cd8ac7992faceb6155d8289308a8318a44'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: false
          trivyignores: 'madutxo-onionator/.trivyignore'
          exit-code: '1'

      - name: Generate SBOM (best effort)
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843
        continue-on-error: true
        with:
          image: 'ghcr.io/madutxo/onionator:0.1.9@sha256:0a6cc16223bab0eee181a0cd040945cd8ac7992faceb6155d8289308a8318a44'

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: onionator-sbom-scheduled
          path: sbom*
          if-no-files-found: ignore
