name: Scan torlink (scheduled)

# The build workflow runs Trivy/SBOM best-effort (continue-on-error) so a
# transient tool download cannot redden a release. This scheduled job is the
# strict complement: it re-scans the already-published, digest-pinned image
# on a cron and FAILS on any CRITICAL finding, so drift is surfaced.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: scan-torlink
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify scan target matches compose
        run: bash scripts/check-scan-target.sh .github/workflows/scan-torlink.yml madutxo-torlink/docker-compose.yml

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ghcr.io/madutxo/torlink:1.11.12@sha256:0703c0faefbaed84e4e1ba39e9f085d78985c72be1d9009a2e4d7bc10143720b'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: false
          trivyignores: 'madutxo-torlink/.trivyignore'
          exit-code: '1'

      - name: Generate SBOM (best effort)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        continue-on-error: true
        with:
          image: 'ghcr.io/madutxo/torlink:1.11.12@sha256:0703c0faefbaed84e4e1ba39e9f085d78985c72be1d9009a2e4d7bc10143720b'

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: torlink-sbom-scheduled
          path: sbom*
          if-no-files-found: ignore

# Touched to force workflow re-registration after the repo recreate.
