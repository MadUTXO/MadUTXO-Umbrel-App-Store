name: Scan rustdesk-server (scheduled)

# The upstream rustdesk/rustdesk-server:1.1.16 image is digest-pinned in compose.
# This scheduled job re-scans it on a cron and FAILS on any CRITICAL finding,
# so drift in the upstream image is surfaced.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: scan-rustdesk
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify scan target matches compose
        run: bash scripts/check-scan-target.sh .github/workflows/scan-rustdesk.yml madutxo-rustdesk-server/docker-compose.yml

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: false
          trivyignores: 'madutxo-rustdesk-server/.trivyignore'
          exit-code: '1'
