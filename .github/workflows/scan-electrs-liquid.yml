name: Scan electrs-liquid (scheduled)

# The build workflow runs Trivy/SBOM best-effort (exit-code 0) so a transient
# tool download cannot redden a release. This scheduled job is the strict
# complement: it re-scans the already-published, digest-pinned image on a cron
# and FAILS on any CRITICAL finding, so drift is surfaced.
#
# trivyignores is the app-scoped file (same reason as torlink).
# It carries CVE-2023-45853 (zlib/minizip, will_not_fix). electrs does
# not unpack zip archives, so the vulnerable minizip entry points are
# unreachable. Do not restate a measured count here — 0.6.9 was flagged with
# three CRITICAL perl-base CVEs (fixed in 0.6.10) while this comment still
# claimed "0 other CRITICAL findings". The scan result is the only authority.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: scan-electrs-liquid
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify scan target matches compose
        run: bash scripts/check-scan-target.sh .github/workflows/scan-electrs-liquid.yml madutxo-liquid-electrs/docker-compose.yml

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ghcr.io/madutxo/electrs-liquid:0.6.10@sha256:e6fdee53a05dc69518aca82b6c02114888f50f26218da8b55a64cb5d7f8ab37d'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: false
          trivyignores: 'madutxo-liquid-electrs/.trivyignore'
          exit-code: '1'

      - name: Generate SBOM (best effort)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        continue-on-error: true
        with:
          image: 'ghcr.io/madutxo/electrs-liquid:0.6.10@sha256:e6fdee53a05dc69518aca82b6c02114888f50f26218da8b55a64cb5d7f8ab37d'

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: electrs-liquid-sbom-scheduled
          path: sbom*
          if-no-files-found: ignore
