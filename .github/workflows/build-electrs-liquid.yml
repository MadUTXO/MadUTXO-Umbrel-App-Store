name: Build electrs-liquid

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'madutxo-liquid-electrs/Dockerfile'
      - 'madutxo-liquid-electrs/entrypoint.sh'

concurrency:
  group: build-electrs-liquid
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push 0.6.11
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./madutxo-liquid-electrs
          file: ./madutxo-liquid-electrs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/madutxo/electrs-liquid:0.6.11
          labels: |
            org.opencontainers.image.title=electrs-liquid
            org.opencontainers.image.source=https://github.com/MadUTXO/MadUTXO-Umbrel-App-Store
            org.opencontainers.image.revision=6cad780be93835b962af735171fae872f9526503
            org.opencontainers.image.version=0.6.11
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach a build provenance attestation (SLSA) so the published image
          # can be traced to this workflow/commit. Strict CVE gating lives in
          # scan-electrs-liquid.yml.
          provenance: true

      - name: Report image digest
        run: echo "electrs-liquid:0.6.11 digest = ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843
        with:
          image: ghcr.io/madutxo/electrs-liquid:0.6.11

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: electrs-liquid-sbom
          path: sbom*

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'ghcr.io/madutxo/electrs-liquid:0.6.11'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: 'madutxo-liquid-electrs/.trivyignore'
          exit-code: '0'

      - name: Upload Trivy results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: electrs-liquid-trivy
          path: trivy-results.sarif

# Touched to force workflow re-registration after the repo recreate.
