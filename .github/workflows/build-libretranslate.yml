name: Build libretranslate

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'madutxo-libretranslate/Dockerfile'
      - 'madutxo-libretranslate/wsgi.py'
      - 'madutxo-libretranslate/seed-models.sh'

concurrency:
  group: build-libretranslate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push 1.9.15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./madutxo-libretranslate
          file: ./madutxo-libretranslate/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/madutxo/libretranslate:1.9.15
          labels: |
            org.opencontainers.image.title=libretranslate
            org.opencontainers.image.source=https://github.com/MadUTXO/MadUTXO-Umbrel-App-Store
            org.opencontainers.image.version=1.9.15
            org.opencontainers.image.base.name=libretranslate/libretranslate:v1.9.6
            org.opencontainers.image.base.digest=sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Generate SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843
        with:
          image: ghcr.io/madutxo/libretranslate:1.9.15

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libretranslate-sbom
          path: sbom*

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'ghcr.io/madutxo/libretranslate:1.9.15'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libretranslate-trivy
          path: trivy-results.sarif
