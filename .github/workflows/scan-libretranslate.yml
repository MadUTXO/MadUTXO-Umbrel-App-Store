name: Scan libretranslate (scheduled)

# The package pins the fork image (ghcr.io/madutxo/libretranslate) by digest, so
# this job re-scans that exact digest on a cron and FAILS on any CRITICAL not in
# the audited register. The register (.trivyignore.libretranslate) lists only
# CRITICALs the audit proved unreachable in this package; anything new reddens
# the job, which is the point.
#
# The fork is built by .github/workflows/build-libretranslate.yml (baked models,
# Werkzeug 3.0.6, refreshed Debian base). That build also emits its own Trivy
# SARIF; this job is the independent, scheduled re-check against the exact
# digest the package installs.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: scan-libretranslate
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify scan target matches compose
        run: bash scripts/check-scan-target.sh .github/workflows/scan-libretranslate.yml madutxo-libretranslate/docker-compose.yml


      - name: Trivy scan (fail on unregistered CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'ghcr.io/madutxo/libretranslate:1.9.15@sha256:7fbbb03d426dc7505342af424d20345b4c29c3a76fe59a2d8f91554d25405d10'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: false
          trivyignores: 'madutxo-libretranslate/.trivyignore'
          exit-code: '1'

      - name: Generate SBOM (best effort)
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843
        continue-on-error: true
        with:
          image: 'ghcr.io/madutxo/libretranslate:1.9.15@sha256:7fbbb03d426dc7505342af424d20345b4c29c3a76fe59a2d8f91554d25405d10'

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: libretranslate-sbom-scheduled
          path: sbom*
          if-no-files-found: ignore
