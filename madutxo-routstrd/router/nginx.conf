worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Privacy: keep the client IP and the request line essentials, but drop the
    # user-agent, referer and query string so tokens/fingerprints do not land in
    # logs. Health probes are not logged.
    log_format privacy '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    map $uri $loggable {
        default 1;
        /health 0;
    }
    access_log /dev/stdout privacy if=$loggable;

    # Read-only root filesystem: keep every temp path on the /tmp tmpfs.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Large prompts and long contexts must reach the gatekeeper. The nginx
    # default is 1 MB, which turns a big chat request into a 413; the default
    # 16 KB body buffer also spills every moderately large body to a temp file.
    client_max_body_size 32m;
    client_body_buffer_size 1m;

    # API keys buy inference, nothing else. The gatekeeper authenticates every
    # request, but its Bearer authorization is default-allow, so a leaked
    # inference key would otherwise reach wallet, key-management and provider
    # routes on the unauthenticated daemon. Allow keyed requests only on the
    # inference surface; everything else is rejected before the gatekeeper.
    # This is an allowlist on purpose: a management route added by a future
    # daemon bump is denied by default instead of silently exposed. NIP-98
    # (Nostr) and anonymous requests are unaffected: the gatekeeper still
    # authenticates and authorizes those. $uri is normalized by nginx, so //,
    # /./ and %-encoded bypasses do not work.
    map $http_authorization $bearer {
        default                    0;
        "~*^Bearer[[:space:]]"     1;
    }
    map $http_x_api_key $apikey {
        default                    0;
        "~."                       1;
    }
    map "$bearer$apikey" $keyauth {
        "00"                       0;
        default                    1;
    }
    map $uri $inference {
        default                    0;
        "~^/v1(/|$)"               1;
        "~^/models(/|$)"           1;
        "~^/health$"               1;
        "~^/ping$"                 1;
    }
    map "$keyauth$inference" $deny {
        default                    0;
        "10"                       1;
    }

    # Umbrel 2.0 (LAN ingress + app gateway) terminates TLS on the app port and
    # forwards the original scheme/host. Trust those headers only from the
    # Umbrel gateway (host bridge IP) or loopback: a co-resident container on
    # the shared network must not be able to spoof the scheme or host used for
    # NIP-98 URL binding. Everything else falls back to the real request.
    map $remote_addr $umbrel_gateway {
        default   0;
        10.21.0.1 1;
        127.0.0.1 1;
    }
    map "$umbrel_gateway:$http_x_forwarded_proto" $fwd_proto {
        default      $scheme;
        "~^1:https$" https;
        "~^1:http$"  http;
    }
    map "$umbrel_gateway:$http_x_forwarded_host" $fwd_host {
        default     $http_host;
        "~^1:(.+)$" $1;
    }
    map "$umbrel_gateway:$http_x_forwarded_for" $fwd_for {
        default     $remote_addr;
        "~^1:(.+)$" $1;
    }

    server {
        listen 3066;
        server_name _;

        # Security headers on every response: no clickjacking, no MIME
        # sniffing, no referrer leakage. CSP is deliberately not set on
        # /terminal: ttyd serves inline/third-party xterm.js assets that a
        # strict CSP would break. API responses get a CSP in location / below.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        if ($deny = 1) {
            return 403;
        }

        # Open the app to the terminal, not the gatekeeper.
        location = / {
            return 302 /terminal/;
        }

        # Web terminal (behind Umbrel login). ttyd is started with
        # `-b /terminal`, so the full path is passed through unchanged.
        # ttyd runs with -O (check-origin), which compares the Origin host:port
        # to the Host header. $http_host preserves the port; $host drops it, so
        # -O would reject the browser's WS upgrade. Keep this as $http_host.
        #
        # Only the Umbrel gateway may open the terminal. All Umbrel apps share
        # umbrel_main_network (10.21.0.0/16), so without this a co-resident
        # container could reach the unauthenticated, writable ttyd here and get
        # a shell as uid 1000. LAN, Tor and Tailscale ingress reach the app
        # through umbreld on the host and therefore arrive from GATEWAY_IP
        # (10.21.0.1); a co-resident container arrives from 10.21.0.x.
        # -O cannot help here: a container can forge Host and Origin.
        location /terminal {
            # Block co-resident containers on the shared bridge (10.21.0.0/16)
            # but keep the host gateway (10.21.0.1) and any non-bridge source.
            # Denying the range (not "deny all") means a wrong assumption cannot
            # lock the operator out of the terminal on a non-bridge path.
            allow 10.21.0.1;
            deny 10.21.0.0/16;
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API and management (gatekeeper). Streaming responses must not be
        # buffered, or SSE completions can appear to end mid-response.
        location / {
            proxy_pass http://127.0.0.1:8008;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $fwd_host;
            proxy_set_header X-Forwarded-For $fwd_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        }
    }
}
