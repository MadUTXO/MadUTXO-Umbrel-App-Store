services:
  app_proxy:
    environment:
      APP_HOST: madutxo-routstrd_app_1
      APP_PORT: 3066
      # API + management paths bypass Umbrel login so agents (API keys) and
      # remote NIP-98 clients can reach the gatekeeper, which authenticates.
      # /settings/* and /cooldowns/* are intentionally excluded (the gatekeeper
      # does not restrict them for Bearer keys).
      PROXY_AUTH_WHITELIST: "/v1/*,/models/*,/health,/ping,/npubs,/clients/*,/usage/*,/wallet/*,/nwc/*,/stop,/refund,/providers,/providers/*"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run

  app:
    image: ghcr.io/madutxo/routstrd:0.1.33@sha256:56390c01686f858b58dca7871d129c829283814fd0032135e718710747e9584a
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    expose:
      - "3066"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3066/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data:/data
