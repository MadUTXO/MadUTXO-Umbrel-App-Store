services:
  app_proxy:
    environment:
      APP_HOST: madutxo-routstrd_app_1
      APP_PORT: 8080

  app:
    image: ghcr.io/madutxo/routstrd:0.1.33@sha256:f7edda84716330b4bb770b03258ff27488021e2850503ac19b8be10a01e2f596
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data:/data
