services:
  app_proxy:
    environment:
      APP_HOST: madutxo-routstrd_app_1
      APP_PORT: 3066
      # API + management paths bypass Umbrel login so agents (API keys) and
      # remote NIP-98 clients can reach the gatekeeper, which authenticates.
      # /settings/* and /cooldowns/* are intentionally excluded so they stay
      # behind the Umbrel login; keyed requests are refused at nginx anyway.
      PROXY_AUTH_WHITELIST: "/v1/*,/models,/models/*,/health,/ping,/npubs,/clients,/clients/*,/usage,/usage/*,/wallet/*,/nwc/*,/stop,/refund,/refund/xcashu,/providers,/providers/*"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run

  app:
    image: ghcr.io/madutxo/routstrd:0.5.9@sha256:7206687ccc3aa961086345bde068c7f18800488fa7020927bd9466ae58554984
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 90s
    mem_limit: "2g"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /run:size=16m
    expose:
      - "3066"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3066/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data:/data
