[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; The daemon owns the wallet. It must start first and stop last.
; Call the real CLI directly (bun + dist/index.js) so the app-managed daemon
; bypasses the user-facing /usr/local/bin/routstrd wrapper, which blocks
; 'daemon' for interactive users.
[program:routstrd]
command=/usr/local/bin/bun /usr/local/bun/install/global/node_modules/routstrd/dist/index.js daemon --host 127.0.0.1 --port 8009
directory=/data
priority=10
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The gatekeeper needs routstr.db to exist; it retries until the daemon has
; created it.
[program:gatekeeper]
command=/usr/local/bin/bun run /app/auth/src/index.ts start
directory=/app/auth
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Browser terminal. tmux keeps the session alive across tab closes.
; -O rejects WebSocket upgrades whose Origin does not match the Host header,
; so a malicious website the operator visits cannot hijack the writable
; terminal (cross-site WebSocket hijacking). The browser still works because
; nginx forwards Host with the port ($http_host) to match the Origin.
[program:ttyd]
command=/usr/local/bin/ttyd -W -O -p 7681 -i 127.0.0.1 -b /terminal -t title=Routstr -t disableLeaveAlert=true tmux -f /etc/tmux.conf new-session -A -s routstrd /terminal.sh
directory=/data
environment=TMUX_TMPDIR=/tmp/tmux,TERM=xterm-256color
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Path router: /terminal -> ttyd, everything else -> gatekeeper.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
