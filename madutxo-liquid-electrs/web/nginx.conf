server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Phase 4)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://electrs:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        add_header Cache-Control "no-cache";
    }

    location = /tor-address {
        alias /tor/main/hostname;
        add_header Cache-Control "no-cache, no-store";
        access_log off;
        # If hostname not yet generated (tor bootstrapping), return 204 instead of 404
        error_page 404 =204 /empty;
    }
    location = /empty {
        access_log off;
        return 204;
    }
}


