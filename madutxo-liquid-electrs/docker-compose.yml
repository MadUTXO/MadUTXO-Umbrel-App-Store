services:
  app_proxy:
    environment:
      APP_HOST: web
      APP_PORT: 8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run

  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
      - /usr/share/nginx/html
      - /etc/nginx/conf.d
    volumes:
      - ${APP_DATA_DIR}/web/index.html:/tmp/index.template.html:ro
      - ${APP_DATA_DIR}/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/icon.svg:/usr/share/nginx/html/icon.svg:ro
      - ${APP_DATA_DIR}/web/umbrel-qr-icon.svg:/usr/share/nginx/html/umbrel-qr-icon.svg:ro
      - ${TOR_DATA_DIR}/app-madutxo-liquid-electrs:/tor:ro
    environment:
      ELECTRS_LIQUID_VERSION: "${APP_VERSION}"
    command: ["sh", "-c", "envsubst '$$ELECTRS_LIQUID_VERSION' < /tmp/index.template.html > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]

  api_cors:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
      - /etc/nginx/conf.d
    expose:
      - "9130"
    command: ["sh", "-c", "printf 'map \\$$http_origin \\$$cors_origin { default \"\"; \"~^https?://(umbrel\\\\.local|.*\\\\.onion)(:\\\\d+)?$$\" \\$$http_origin; }\\nserver { listen 9130; location / { proxy_pass http://electrs:3000; proxy_set_header Host \\$$host; add_header Cache-Control no-cache; add_header Access-Control-Allow-Origin \\$$cors_origin always; add_header Access-Control-Allow-Methods \"GET, OPTIONS\" always; add_header Access-Control-Allow-Headers Content-Type always; if (\\$$request_method = OPTIONS) { return 204; } } }' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]

  electrs:
    image: ghcr.io/madutxo/electrs-liquid:0.6.1@sha256:337460bfd27ace531f12d7af1f939a43bfbaa40160d3a5310157266960a25eeb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    ports:
      - "60601:60601"
    expose:
      - "3000"
    stop_grace_period: 60s
    volumes:
      - "${APP_DATA_DIR}/data/electrs:/data"
    environment:
      ELEMENTS_RPC_PASSWORD: "${APP_ELECTRS_LIQUID_ELEMENTS_RPC_PASS}"
      # 0.6.1 has --daemon-rpc-conn-max-age (45s recycle before Elements 30s idle close); DAEMON_* 5/60/60/10 tuned, WARN fixed
      DAEMON_CONNECTION_TIMEOUT: "5"
      DAEMON_READ_TIMEOUT: "60"
      DAEMON_WRITE_TIMEOUT: "60"
      DAEMON_CONN_RECYCLE_COOLDOWN: "10"
    command:
      - -v
      - --network
      - liquid
      - --daemon-rpc-addr
      - "elements_node_1:7041"
      - --electrum-rpc-addr
      - "0.0.0.0:60601"
      - --http-addr
      - "0.0.0.0:3000"
      - --db-dir
      - /data/db
      - --db-block-cache-mb
      - "32"
      - --db-write-buffer-size-mb
      - "64"
      - --daemon-parallelism
      - "2"
      - --daemon-rpc-conn-max-age
      - "45"
      - --jsonrpc-import

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/app-madutxo-liquid-electrs/main && chmod 700 /data/app-madutxo-liquid-electrs/main && printf 'HiddenServiceDir /data/app-madutxo-liquid-electrs/main\\nHiddenServicePort 60601 madutxo-liquid-electrs_electrs_1:60601\\n' > /tmp/torrc && exec tor -f /tmp/torrc"]
