services:
  app_proxy:
    environment:
      APP_HOST: madutxo-liquid-electrs_web_1
      APP_PORT: 8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.30-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx starts as root and drops to the unprivileged nginx user, which needs
    # CHOWN/SETGID/SETUID. It listens on 8080, so NET_BIND_SERVICE is not needed.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      # nginx writes its vhost here, and needs a pid + temp dirs. The webroot is
      # a tmpfs because the start-up command renders index.html into it; the
      # icon bind-mounts below are then mounted on top of that tmpfs.
      - /run
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /usr/share/nginx/html
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${APP_DATA_DIR}/web/index.html:/tmp/index.template.html:ro
      - ${APP_DATA_DIR}/icon.svg:/usr/share/nginx/html/icon.svg:ro
      - ${APP_DATA_DIR}/web/umbrel-qr-icon.svg:/usr/share/nginx/html/umbrel-qr-icon.svg:ro
    environment:
      ELECTRS_TOR_ADDRESS: "${APP_ELECTRS_LIQUID_RPC_HIDDEN_SERVICE}"
      ELECTRS_LIQUID_VERSION: "${APP_VERSION}"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINXEOF'
        server {
            listen 8080;
            root /usr/share/nginx/html;
            index index.html;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;

            location / {
                try_files $$uri $$uri/ /index.html;
            }

            location /api/ {
                proxy_pass http://madutxo-liquid-electrs_electrs_1:3000/;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_read_timeout 60s;
                client_max_body_size 1m;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" always;
                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "no-referrer" always;
                add_header Cache-Control "no-cache";
            }

            location = /tor-address {
                access_log off;
                add_header Cache-Control "no-cache, no-store";
                return 204;
            }
        }
        NGINXEOF
        envsubst '$$ELECTRS_TOR_ADDRESS $$ELECTRS_LIQUID_VERSION' < /tmp/index.template.html > /usr/share/nginx/html/index.html
        exec nginx -g 'daemon off;'
    depends_on:
      - electrs

  electrs:
    image: ghcr.io/madutxo/electrs-liquid:0.6.10@sha256:e6fdee53a05dc69518aca82b6c02114888f50f26218da8b55a64cb5d7f8ab37d
    # Runs as uid 1000 like every other service. hooks/pre-start hands /data to
    # uid 1000 on the host before the container starts, so the entrypoint needs
    # no root and no capabilities. The root fallback only matters for a manual
    # `docker run` outside Umbrel.
    user: "1000:1000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    ports:
      - "60601:60601"
    expose:
      - "3000"
    stop_grace_period: 60s
    mem_limit: 12g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - "${APP_DATA_DIR}/data/electrs:/data"
    environment:
      # The Elements RPC password is NOT passed as an env var: env is visible to
      # `docker inspect` and /proc/1/environ. exports.sh writes it to the 0600
      # file /data/.elements_rpc_pass (owned by uid 1000) before the container
      # starts, and the entrypoint reads it from there into the cookie file.
      MALLOC_ARENA_MAX: "2"
      # 0.6.1 has --daemon-rpc-conn-max-age (45s recycle before Elements 30s idle close); DAEMON_* 5/60/60/10 tuned, WARN fixed
      DAEMON_CONNECTION_TIMEOUT: "5"
      DAEMON_READ_TIMEOUT: "60"
      DAEMON_WRITE_TIMEOUT: "60"
      DAEMON_CONN_RECYCLE_COOLDOWN: "10"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/blocks/tip/height >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # electrs rebuilds its in-memory header chain on every start before the
      # REST server listens (rest::start runs after indexer.update). At ~4.1M
      # blocks that is several minutes, so a short grace window marks the
      # container unhealthy on every restart. 600s covers it with headroom.
      start_period: 600s
    command:
      - --network
      - liquid
      - --daemon-rpc-addr
      - "elements_node_1:7041"
      - --electrum-rpc-addr
      - "0.0.0.0:60601"
      - --http-addr
      - "0.0.0.0:3000"
      - --db-dir
      - /data/db
      - --db-block-cache-mb
      - "32"
      - --db-write-buffer-size-mb
      - "64"
      - --db-parallelism
      - "2"
      - --initial-sync-batch-size
      - "150"
      - --cache-index-filter-blocks
      - --daemon-parallelism
      - "1"
      - --daemon-rpc-conn-max-age
      - "45"
      - --jsonrpc-import

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.14@sha256:7663d18fe37b3edd97c859aa36bb5eeaa328d86c57729db0433dff430e8abd8d
    user: "1000:1000"
    restart: unless-stopped
    # tor resolves the electrs container name when it parses HiddenServicePort,
    # so without ordering it fails on a cold stack start and only comes up on
    # the restart. It needs the name to exist, not electrs to be healthy.
    depends_on:
      - electrs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - CHOWN
    read_only: true
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/app-madutxo-liquid-electrs/main && chmod 700 /data/app-madutxo-liquid-electrs /data/app-madutxo-liquid-electrs/main && printf 'HiddenServiceDir /data/app-madutxo-liquid-electrs/main\\nHiddenServicePort 60601 madutxo-liquid-electrs_electrs_1:60601\\n' > /tmp/torrc && exec tor -f /tmp/torrc"]
