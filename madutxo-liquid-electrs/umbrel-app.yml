category: bitcoin
name: Electrs Liquid
version: "0.7.44"
tagline: Personal Electrum server for the Liquid Network
description: >-
  Run your personal Electrum server for the Liquid Network and connect your
  wallet to it instead of relying on Blockstream's public servers.


  Without your own server, your wallet queries Blockstream's infrastructure
  to check balances and transactions — leaking which addresses are yours.
  Even though Liquid uses Confidential Transactions (hidden amounts and assets),
  the transaction graph is still visible. Input ownership heuristics still apply,
  and swaps used to enter/exit Liquid can correlate amounts, origin, and destination.


  With Electrs Liquid, all wallet queries stay local. Nobody can build a profile
  of your Liquid activity.


  NOTE - Requires the Elements Core app to be installed and synced. Wait until Electrs
  shows Running and a block height before connecting a wallet.


  - How to use it with SideSwap -

  SideSwap can use your node for balances, PEG-IN/OUT and L-BTC to L-USDT swaps.

  1. Open this app in Umbrel and note the address shown (local or Tor)

  2. In SideSwap open Settings > Network access > Personal Electrum Server. Set Host to your Liquid-electrs address without the port, then set Port to 60601 (TLS off). Save and restart SideSwap.

  3. Away from home on Android, you need Orbot to reach the onion address. Install Orbot from Zapstore or Obtainium and turn on VPN mode (Orbot runs a proxy at 127.0.0.1:9050). In SideSwap open Settings > Network access > Proxy. Toggle Use proxy ON, Host 127.0.0.1, Port 9050.
  
  
releaseNotes: >-
  Tor sidecar 0.4.7.8 to 0.4.9.11 (fixes EOL, bootstrap stall at 30 percent, dead 60601 hidden service).

  Memory tuning for Umbrel servers: bound RocksDB index and filter blocks in cache, smaller write buffers, single-threaded sync, 3GB container limit so indexing cannot freeze the host.

  Proxy fix: web and api now use the full container name so Umbrel cannot route to the wrong Electrs app on shared networks.

  Startup fix: password backup write can no longer kill startup (fixes restart loop exit 2 on root-owned password file).

  Image 0.6.2: same Electrs source, fixed startup script baked in (digest-pinned, both architectures).

  Maintained by MadUTXO.
