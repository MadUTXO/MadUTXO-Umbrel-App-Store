manifestVersion: 1
id: madutxo-libretranslate
category: tools
name: LibreTranslate
icon: https://raw.githubusercontent.com/MadUTXO/MadUTXO-Umbrel-App-Store/master/madutxo-libretranslate/icon.png
version: "1.9.10"
tagline: Free and Open Source Machine Translation API
description: >-
  LibreTranslate is a free and open source machine translation API.
  It allows you to run your own self-hosted translation service
  without relying on third-party services.


  Features:
  - Supports 30+ languages
  - Self-hosted, privacy-focused
  - Easy to set up and use
  - Web interface for translation

  Models: the language models for English, Spanish, French, German, Italian and
  Portuguese are bundled in the image. The app does not download models at
  start and works without network access.
developer: LibreTranslate
website: https://libretranslate.com
