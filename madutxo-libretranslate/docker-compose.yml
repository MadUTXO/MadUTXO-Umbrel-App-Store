services:
  app_proxy:
    environment:
      APP_HOST: madutxo-libretranslate_main_1
      APP_PORT: 5000
      PROXY_AUTH_ADD: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run

  main:
    image: ghcr.io/madutxo/libretranslate:1.9.6@sha256:c7bbef4d3f02740640bdaa2f246418f8e1eb99a1de953880c2be5f38dbde7590
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    mem_limit: 4g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /app/db:uid=1000,gid=1000,mode=0755
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - TZ=${TZ:-UTC}
      - LT_LOAD_ONLY=en,es,fr,de,it,pt
      - LT_THREADS=2
      - XDG_DATA_HOME=/data/.local/share
      - XDG_CONFIG_HOME=/data/.config
      - XDG_CACHE_HOME=/data/.local/cache
      - LT_CHAR_LIMIT=5000
      - LT_REQ_LIMIT=60
      - LT_BATCH_LIMIT=10
      - LT_REQ_FLOOD_THRESHOLD=120
    volumes:
      - ${APP_DATA_DIR}/data:/data:rw
