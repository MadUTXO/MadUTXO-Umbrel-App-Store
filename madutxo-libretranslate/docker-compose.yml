services:
  app_proxy:
    environment:
      APP_HOST: madutxo-libretranslate_main_1
      APP_PORT: 5000
      PROXY_AUTH_ADD: "true"
      PROXY_AUTH_WHITELIST: "/translate,/languages,/health"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run

  main:
    image: ghcr.io/madutxo/libretranslate:1.9.15@sha256:7fbbb03d426dc7505342af424d20345b4c29c3a76fe59a2d8f91554d25405d10
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: 4g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      # Bound the RAM-backed scratch space: an oversized body or a runaway
      # worker must not exhaust the memory budget (backed by host RAM). 512 MB
      # is generous for normal translation; /app/db holds prometheus data, and
      # the optional key database lives on /data so it survives restarts.
      - /tmp:size=512m
      - /run:size=16m
      - /app/db:uid=1000,gid=1000,mode=0755,size=64m
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - TZ=${TZ:-UTC}
      - LT_LOAD_ONLY=en,es,fr,de,it,pt
      - LT_THREADS=2
      - XDG_DATA_HOME=/data/.local/share
      - XDG_CONFIG_HOME=/data/.config
      - XDG_CACHE_HOME=/data/.local/cache
      - LT_CHAR_LIMIT=5000
      - LT_BATCH_LIMIT=50
      - LT_REQ_LIMIT=180
      - LT_REQ_FLOOD_THRESHOLD=360
      - LT_HOURLY_REQ_LIMIT=1200
      - LT_ALTERNATIVES_LIMIT=3
      - LT_API_KEYS=true
      - LT_API_KEYS_DB_PATH=/data/api_keys.db
      - LT_MAX_CONTENT_LENGTH=2000000
      - LT_MAX_CONTENT_LENGTH_FILE=67108864
      - LT_CORS_ORIGINS=
    volumes:
      - ${APP_DATA_DIR}/data:/data:rw
