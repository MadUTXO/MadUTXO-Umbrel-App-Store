services:
  app_proxy:
    environment:
      APP_HOST: madutxo-libretranslate_main_1
      APP_PORT: 5000
      PROXY_AUTH_ADD: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run

  main:
    image: libretranslate/libretranslate:v1.9.5@sha256:b358e61598c9d5240ddb5f9e8f53389931db8305ccfd426fbfcc603f4b24c7a4
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /run
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - TZ=${TZ:-UTC}
      - LT_LOAD_ONLY=en,es,fr,de,it,pt
    volumes:
      - ${APP_DATA_DIR}/data:/data:rw
