<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rustdesk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="6" refY="4.5" orient="auto-start-reverse">
      <path d="M 0 0 L 12 4.5 L 0 9 Z" fill="white"/>
    </marker>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#rustdesk-bg)"/>
  <!-- Top arc: clockwise arrow from upper-left to upper-right -->
  <path d="M 28 34 Q 50 18 72 34" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Bottom arc: clockwise arrow from lower-right to lower-left -->
  <path d="M 72 66 Q 50 82 28 66" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
