manifestVersion: 1
id: madutxo-rustdesk-server
storage:
  dataRoot: data
category: networking
name: RustDesk Server
version: "1.1.16"
tagline: Self-hosted RustDesk ID and relay server
description: >-
  RustDesk is an open-source, self-hosted remote desktop server. This package
  runs the hbbs ID/signaling server and hbbr relay server on your Umbrel, so
  your RustDesk clients can connect without relying on public relays.

  Open the app's web page from the Umbrel dashboard. It shows the correct IP
  and ports for your clients (ID Server and Relay Server) plus the public key
  to enter in RustDesk Settings → Network → ID/Relay Server.

  Supports both LAN and NostrVPN mesh connections: the web page detects how
  you reached it and shows LAN_IP or MESH_IP accordingly. Clients can use
  either address to reach this server.

  Ports used: 21115 (ID server, TCP), 21116 (device registration + NAT hole
  punching, TCP+UDP), 21117/21119 (relay, TCP). Make sure the host firewall
  allows these from your LAN and/or NostrVPN subnet.
developer: RustDesk Team
website: https://rustdesk.com
submitter: MadUTXO
submission: https://github.com/MadUTXO/MadUTXO-Umbrel-App-Store/tree/master/madutxo-rustdesk-server
repo: https://github.com/rustdesk/rustdesk-server
support: https://github.com/rustdesk/rustdesk/issues
gallery: []
releaseNotes: >-
  1.1.16:
  - Ported from umbrel-apps/community with MadUTXO security hardening.
  - Replaced network_mode: host with explicit port publishing so the app works
    on Umbrel's bridged network and is reachable via NostrVPN mesh IP.
  - Corrected client ports per official RustDesk docs: ID Server 21115,
    Relay Server 21116 (TCP+UDP).
  - Security: read-only rootfs, cap_drop ALL, no-new-privileges, servers
    run as 1000:1000, bounded log rotation.
  - Web page auto-detects LAN vs NostrVPN mesh access and shows the correct
    IP for client configuration.
path: ""
port: 21080
defaultUsername: ""
defaultPassword: ""
dependencies: []
icon: https://raw.githubusercontent.com/MadUTXO/MadUTXO-Umbrel-App-Store/master/madutxo-rustdesk-server/icon.png
requiresHttps: false
