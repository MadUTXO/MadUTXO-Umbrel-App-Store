version: '3.7'

services:
  # app_proxy is metadata only: umbrelOS reads APP_HOST/APP_PORT to route the
  # manifest port to the web service. In umbrelOS 2.0 no app_proxy container
  # runs, so this service must stay environment-only.
  app_proxy:
    environment:
      APP_HOST: madutxo-rustdesk-server_web_1
      APP_PORT: 8080
      # The page only shows the LAN/mesh IP and the public key, so keep it
      # behind the Umbrel login like the other apps' proxies.
      PROXY_AUTH_ADD: "true"

  hbbs:
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: "512m"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    command: hbbs
    volumes:
      - ${APP_DATA_DIR}/data/hbbs:/root:rw
    healthcheck:
      # 21115 == 0x527B. Read the kernel socket tables instead of shelling out
      # to ss, which the upstream image does not ship (tcp6 covers IPv6 binds).
      test: ["CMD-SHELL", "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -qi ':527B' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - hbbr

  hbbr:
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: "512m"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "21117:21117"
      - "21119:21119"
    command: hbbr
    volumes:
      - ${APP_DATA_DIR}/data/hbbr:/root:rw
    healthcheck:
      # 21117 == 0x527D
      test: ["CMD-SHELL", "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -qi ':527D' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: "128m"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx starts as root and drops to the unprivileged nginx user, which needs
    # CHOWN/SETGID/SETUID. It listens on 8080, so NET_BIND_SERVICE is not needed.
    # Do not force user 1000:1000 here: the nginx image needs its root
    # entrypoint to set up the drop to the nginx user.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /run
      # nginx writes its vhost here; the server block is rendered below.
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINXEOF'
        server {
            listen 8080;
            root /usr/share/nginx/html;
            index index.html;
            server_tokens off;
            # Static page: nothing worth persisting, and the log lives on tmpfs.
            access_log off;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;

            location / {
                try_files $$uri $$uri/ =404;
            }
        }
        NGINXEOF
        exec nginx -g 'daemon off;'
