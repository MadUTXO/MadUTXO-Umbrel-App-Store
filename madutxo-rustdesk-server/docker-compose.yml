version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: rustdesk-server_web_1
      APP_PORT: 80
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run

  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: "512m"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    command: hbbs
    volumes:
      - ${APP_DATA_DIR}/data/hbbs:/root:rw
    healthcheck:
      test: ["CMD-SHELL", "ss -tuln | grep -q ':21115' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - hbbr

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:1.1.16@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: "512m"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    ports:
      - "21117:21117"
      - "21119:21119"
    command: hbbr
    volumes:
      - ${APP_DATA_DIR}/data/hbbr:/root:rw
    healthcheck:
      test: ["CMD-SHELL", "ss -tuln | grep -q ':21117' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.27@sha256:124b44bfc9ccd1f3cedf4b592d4d1e8bddb78b51ec2ed5056c52d3692baebc19
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    mem_limit: "128m"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0755
      - /run:uid=1000,gid=1000,mode=0755
      - /etc/nginx/conf.d:uid=1000,gid=1000,mode=0755
      - /var/cache/nginx:uid=1000,gid=1000,mode=0755
      - /var/log/nginx:uid=1000,gid=1000,mode=0755
    expose:
      - "80"
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
